name: Daily commodities brief

on:
  schedule:
    # 05:30 UTC = 06:30 BST, plus a retry slot at 08:00 UTC in case GitHub skips or delays
    # the first one (common for new schedules). The retry never overwrites a brief that
    # already exists. After clocks go back (25 Oct 2026) use "30 6" and "0 9" to keep UK times.
    - cron: "30 5 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Brief date (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""
  # Smoke test: any change to the pipeline re-runs it. Only a manual "Run workflow"
  # overwrites an existing brief for the day (--force); pushes and schedules never do.
  push:
    paths:
      - "scripts/**"
      - "prompts/**"
      - "requirements.txt"
      - ".github/workflows/daily-brief.yml"

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Subscription auth for the analysis tier. Generate with `claude setup-token` locally
    # and store as the CLAUDE_CODE_OAUTH_TOKEN repo secret; it lasts a year. Without it
    # the run still produces the data-only Tier 0 brief.
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Claude Code CLI
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve date
        id: d
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT";
          else echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"; fi

      - name: Fetch prices
        env:
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
        run: python scripts/fetch_prices.py --date "${{ steps.d.outputs.date }}"

      - name: Fetch headlines
        run: python scripts/fetch_news.py --date "${{ steps.d.outputs.date }}"

      # --tier1 auto: the Claude CLI if the step above installed it (billed to the
      # subscription), else ANTHROPIC_API_KEY if that secret is set, else Tier 0.
      - name: Build brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_MODEL: ${{ vars.BRIEF_MODEL }}
        run: |
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FORCE="--force"; fi
          python scripts/build_brief.py --date "${{ steps.d.outputs.date }}" $FORCE

      - name: Commit and push
        run: |
          git config user.name "commodities-brief-bot"
          git config user.email "commodities-brief-bot@users.noreply.github.com"
          git add briefs data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "brief: ${{ steps.d.outputs.date }}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
