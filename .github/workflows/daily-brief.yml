name: Daily commodities brief

on:
  schedule:
    # 05:30 UTC = 06:30 BST, plus a retry slot at 08:00 UTC in case GitHub skips or delays
    # the first one (common for new schedules). The retry never overwrites a brief that
    # already exists. After clocks go back (25 Oct 2026) use "30 6" and "0 9" to keep UK times.
    - cron: "30 5 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Brief date (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""
  # Smoke test: any change to the pipeline re-runs it. Only a manual "Run workflow"
  # overwrites an existing brief for the day (--force); pushes and schedules never do.
  push:
    paths:
      - "scripts/**"
      - "prompts/**"
      - "requirements.txt"
      - ".github/workflows/daily-brief.yml"

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Subscription auth for the analysis tier. Generate with `claude setup-token` locally
    # and store as the CLAUDE_CODE_OAUTH_TOKEN repo secret; it lasts a year. Without it
    # the run still produces the data-only Tier 0 brief.
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Claude credentials
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN: present, ${#CLAUDE_CODE_OAUTH_TOKEN} chars"
            case "$CLAUDE_CODE_OAUTH_TOKEN" in
              sk-ant-oat*) echo "prefix: looks right" ;;
              *) echo "prefix: WRONG - a setup-token value starts with sk-ant-oat" ;;
            esac
          else
            echo "CLAUDE_CODE_OAUTH_TOKEN: MISSING."
            echo "Add it under Settings > Secrets and variables > Actions > Repository secrets."
          fi

      # Installed unconditionally: if the token is missing or bad, the brief then
      # carries the real error instead of silently dropping to Tier 0.
      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: Resolve date
        id: d
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT";
          else echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"; fi

      - name: Fetch prices
        env:
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
        run: python scripts/fetch_prices.py --date "${{ steps.d.outputs.date }}"

      - name: Fetch headlines
        run: python scripts/fetch_news.py --date "${{ steps.d.outputs.date }}"

      # --tier1 auto: the Claude CLI if the step above installed it (billed to the
      # subscription), else ANTHROPIC_API_KEY if that secret is set, else Tier 0.
      - name: Build brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_MODEL: ${{ vars.BRIEF_MODEL }}
        run: |
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FORCE="--force"; fi
          python scripts/build_brief.py --date "${{ steps.d.outputs.date }}" $FORCE

      # briefs/ and data/ are regenerated wholesale each run, so a plain rebase onto a
      # concurrent run's commit conflicts on every one of them. This run's output is the
      # newer of the two, so replay it with -X theirs ("theirs" = the commit being
      # replayed) and retry the push a few times.
      - name: Commit and push
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          git config user.name "commodities-brief-bot"
          git config user.email "commodities-brief-bot@users.noreply.github.com"
          git add briefs data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "brief: ${{ steps.d.outputs.date }}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push rejected; replaying onto latest $BRANCH"
            git fetch origin "$BRANCH"
            git rebase -X theirs "origin/$BRANCH" || { git rebase --abort; exit 1; }
          done
          echo "could not push after 3 attempts" >&2
          exit 1
